<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07152f">
<title>Kulzzy Radio Navigation</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;padding:0;width:100%;min-width:0;height:100%;
    min-height:100%;font-family:Arial,Helvetica,sans-serif;
    background:transparent;touch-action:auto;pointer-events:auto
}
body{overflow:hidden;-webkit-overflow-scrolling:touch}

/* NAVIGATION */
#kulzzyNav{
    position:fixed;top:0;left:50%;transform:translateX(-50%);
    width:calc(100% - 16px);max-width:520px;height:40px;
    background:rgba(7,21,47,.98);
    border:1px solid rgba(255,215,0,.45);border-radius:11px;
    display:flex;align-items:center;justify-content:space-around;
    padding:2px;z-index:2147483647;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
    pointer-events:auto;touch-action:manipulation
}

.kulzzyNavBtn{
    flex:1;width:100%;height:34px;border:0;background:transparent;
    color:white;font-size:11px;font-weight:bold;border-radius:8px;
    cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
    pointer-events:auto;touch-action:manipulation;padding:0 2px
}
.kulzzyNavBtn:hover{background:rgba(255,215,0,.15);color:#ffd700}
.kulzzyNavBtn:active{background:rgba(255,215,0,.25)}
.kulzzyNavBtn.active{background:#ffd700;color:#07152f}

/* MAIN CONTENT */
#kulzzyContent{
    position:relative;z-index:1;
    width:100%!important;max-width:none!important;min-width:0;
    margin:0!important;padding:48px 0 30px!important;
    height:100dvh!important;min-height:100dvh!important;
    max-height:100dvh!important;overflow-y:auto!important;
    overflow-x:hidden!important;touch-action:auto!important;
    overscroll-behavior:auto!important;pointer-events:auto!important;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    -ms-overflow-style:none
}
#kulzzyContent::-webkit-scrollbar{display:none}

.kulzzySection{
    display:none;width:100%!important;max-width:none!important;
    min-width:0;margin:0!important;padding:0!important;
    position:relative;left:0;right:0;
    overflow:visible!important;touch-action:auto!important;
    pointer-events:auto!important
}
.kulzzySection.active{display:block}

/* PUBLISHED CONTENT */
.kulzzyPublishedContent{
    display:block;width:100%!important;max-width:none!important;
    min-width:0;margin:0!important;padding:0!important;
    overflow:visible!important;touch-action:auto!important;
    pointer-events:auto!important;-webkit-overflow-scrolling:touch
}
.kulzzyPublishedContent>div{
    width:100%;max-width:none;margin:0;padding:0;
    pointer-events:auto!important;touch-action:auto!important
}
.kulzzyPublishedContent button,
.kulzzyPublishedContent a,
.kulzzyPublishedContent input,
.kulzzyPublishedContent textarea,
.kulzzyPublishedContent select,
.kulzzyPublishedContent label,
.kulzzyPublishedContent video,
.kulzzyPublishedContent audio,
.kulzzyPublishedContent canvas,
.kulzzyPublishedContent iframe,
.kulzzyPublishedContent [role="button"],
.kulzzyPublishedContent [onclick]{
    pointer-events:auto!important;touch-action:auto!important
}
.kulzzyPublishedContent img{max-width:100%;height:auto}
.kulzzyPublishedContent iframe{
    display:block;width:100%!important;max-width:100%!important;
    border:0
}
.kulzzyPublishedContent table{max-width:100%}

/* MORE MENU */
#kulzzyMorePagesMenu{
    width:100%;max-width:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:8px;
    pointer-events:auto!important;touch-action:auto!important
}
.kulzzyMorePageButton{
    width:100%;border:1px solid rgba(255,215,0,.35);
    border-radius:10px;padding:12px;background:#07152f;color:white;
    text-align:left;font-size:14px;font-weight:bold;cursor:pointer;
    display:flex;align-items:center;gap:10px;
    -webkit-tap-highlight-color:transparent;
    pointer-events:auto!important;touch-action:manipulation
}
.kulzzyMorePageButton:hover{background:rgba(255,215,0,.12);color:#ffd700}
.kulzzyMorePageButton:active{background:rgba(255,215,0,.25)}
.kulzzyMorePageButton.active{background:#ffd700;color:#07152f}

.kulzzyMorePageIcon{
    width:34px;height:34px;min-width:34px;display:flex;
    align-items:center;justify-content:center;
    background:rgba(255,215,0,.12);
    border:1px solid rgba(255,215,0,.35);border-radius:9px;
    font-size:20px;line-height:1;pointer-events:none
}
.kulzzyMorePageTitle{flex:1;min-width:0;line-height:1.3;pointer-events:none}

/* MORE PAGE OVERLAY */
#kulzzyMorePageContent{
    position:fixed!important;
    inset:0!important;
    width:100%!important;
    height:100dvh!important;
    min-height:100dvh!important;
    max-height:100dvh!important;
    margin:0!important;
    padding:52px 0 24px!important;
    background:#07152f;
    z-index:2147483647!important;
    display:none;
    overflow-y:auto!important;
    overflow-x:hidden!important;
    overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    pointer-events:auto!important;
    touch-action:pan-y!important
}
#kulzzyMorePageContent::-webkit-scrollbar{display:none}
#kulzzyMorePageContent.open{display:block!important}

.kulzzyMorePageContentBox{
    position:relative;z-index:1;
    width:100%;max-width:none;margin:0;padding:0 0 25px;
    background:transparent;color:white;border:0;border-radius:0;
    overflow:visible!important;line-height:1.6;
    pointer-events:auto!important;touch-action:auto!important
}

/* MORE PAGE CLOSE BUTTON */
.kulzzyMorePageClose{
    position:fixed!important;top:6px!important;right:8px!important;
    width:36px!important;height:36px!important;
    min-width:36px!important;min-height:36px!important;
    border:1px solid rgba(255,215,0,.7)!important;
    border-radius:9px!important;background:#07152f!important;
    color:#ffd700!important;font-size:21px!important;
    font-weight:bold!important;line-height:1!important;
    cursor:pointer!important;z-index:2147483646!important;
    display:flex!important;align-items:center!important;
    justify-content:center!important;
    box-shadow:0 2px 8px rgba(0,0,0,.5)!important;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation!important;pointer-events:auto!important
}
.kulzzyMorePageClose:active{
    background:#ffd700!important;color:#07152f!important
}

/* EMBEDDED PAGE CONTENT */
.kulzzyMorePageContentBox *,
.kulzzyHomePageContentBox *{box-sizing:border-box;max-width:100%}

.kulzzyMorePageContentBox img,
.kulzzyHomePageContentBox img{
    max-width:100%!important;height:auto!important
}
.kulzzyMorePageContentBox video,
.kulzzyHomePageContentBox video{
    max-width:100%!important;height:auto!important;pointer-events:auto!important
}
.kulzzyMorePageContentBox iframe,
.kulzzyHomePageContentBox iframe{
    display:block;width:100%!important;max-width:100%!important;
    border:0;pointer-events:auto!important;touch-action:auto!important
}
.kulzzyMorePageContentBox button,
.kulzzyMorePageContentBox a,
.kulzzyMorePageContentBox input,
.kulzzyMorePageContentBox textarea,
.kulzzyMorePageContentBox select,
.kulzzyMorePageContentBox label,
.kulzzyMorePageContentBox canvas,
.kulzzyHomePageContentBox button,
.kulzzyHomePageContentBox a,
.kulzzyHomePageContentBox input,
.kulzzyHomePageContentBox textarea,
.kulzzyHomePageContentBox select,
.kulzzyHomePageContentBox label,
.kulzzyHomePageContentBox canvas{
    pointer-events:auto!important;touch-action:auto!important
}
.kulzzyMorePageContentBox table,
.kulzzyHomePageContentBox table{
    width:100%;max-width:100%;overflow:auto;display:block
}
.kulzzyMorePageContentBox p,
.kulzzyHomePageContentBox p{line-height:1.7}
.kulzzyMorePageContentBox a,
.kulzzyHomePageContentBox a{word-break:break-word}
.kulzzyMorePageContentBox ul,
.kulzzyMorePageContentBox ol,
.kulzzyHomePageContentBox ul,
.kulzzyHomePageContentBox ol{padding-left:25px}

/* HOME OVERLAY */
#kulzzyHomePageContent{
    position:fixed!important;
    inset:0!important;
    width:100%!important;
    height:100dvh!important;
    min-height:100dvh!important;
    margin:0!important;
    padding:48px 0 25px!important;
    background:transparent!important;
    z-index:2147483000!important;
    display:none;
    overflow-y:auto;
    overflow-x:hidden;
    pointer-events:auto;
    touch-action:auto;
    overscroll-behavior:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none
}
#kulzzyHomePageContent::-webkit-scrollbar{display:none}
#kulzzyHomePageContent.open{display:block!important}

#kulzzyNav{z-index:2147483647!important}

.kulzzyHomePageContentBox{
    width:100%;max-width:none;margin:0;padding:0 0 25px;
    background:transparent!important;color:white;
    overflow:visible!important;line-height:1.6;
    pointer-events:auto!important;touch-action:auto!important
}

/* STATUS AND RETRY MESSAGES */
.kulzzyPageStatus{
    margin:10px;padding:16px;
    border:1px solid rgba(255,215,0,.45);
    border-radius:10px;
    background:rgba(7,21,47,.94);
    color:#fff;text-align:center;line-height:1.5;
    overflow-wrap:anywhere
}
.kulzzyRetryButton{
    margin-top:12px;padding:10px 18px;
    border:0;border-radius:8px;
    background:#ffd700;color:#07152f;
    font-weight:bold;cursor:pointer;
    touch-action:manipulation
}

/* VOTING COMPETITION CARDS */
.kulzzyVotersGrid{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;padding:8px 10px 22px
}
.kulzzyVoterCard{
    display:block;width:100%;padding:0;overflow:hidden;
    border:1px solid rgba(255,215,0,.6);border-radius:12px;
    background:#07152f;color:white;text-align:left;cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.18);
    touch-action:manipulation
}
.kulzzyVoterCard img{
    display:block;width:100%;height:160px;object-fit:cover;
    background:#10274c
}
.kulzzyVoterCardTitle{
    display:block;padding:10px;font-size:14px;font-weight:bold;
    line-height:1.35;color:#ffd700
}
.kulzzyVotersEmpty{
    grid-column:1/-1;text-align:center;padding:24px 14px;color:#ddd;
    background:rgba(7,21,47,.8);
    border:1px solid rgba(255,215,0,.2);border-radius:10px
}
.kulzzyVotersDetail{padding:8px 10px 22px}
.kulzzyVoterBack{
    display:block;width:100%;border:0;border-radius:9px;padding:12px;
    margin:0 0 12px;background:#ffd700;color:#07152f;
    font-weight:bold;font-size:14px;touch-action:manipulation
}
.kulzzyVoterDetailTitle{
    font-size:20px;color:#ffd700;font-weight:bold;margin:10px 0 14px
}
.kulzzyVoterDetailBody{
    width:100%;overflow:visible;background:transparent;color:white
}
.kulzzyVoterDetailBody iframe{
    display:block;width:100%;min-height:75vh;border:0;
    background:white;border-radius:8px
}

@media(max-width:360px){
    #kulzzyNav{width:calc(100% - 8px);height:38px}
    .kulzzyNavBtn{height:32px;font-size:9px}
    #kulzzyContent{padding-top:45px!important}
    #kulzzyHomePageContent{padding-top:45px!important}
    #kulzzyMorePageContent{padding-top:48px!important}
    .kulzzyMorePageClose{
        top:5px!important;right:5px!important;
        width:34px!important;height:34px!important;
        min-width:34px!important;min-height:34px!important
    }
    .kulzzyVotersGrid{gap:7px;padding:7px}
    .kulzzyVoterCard img{height:130px}
    .kulzzyVoterCardTitle{font-size:12px;padding:8px}
}
@media(min-width:361px) and (max-width:600px){
    .kulzzyNavBtn{font-size:10px}
}
</style>
</head>

<body>

<nav id="kulzzyNav">
    <button type="button" class="kulzzyNavBtn active" data-section="home">Home</button>
    <button type="button" class="kulzzyNavBtn" data-section="voters">🗳️ VOTERS</button>
    <button type="button" class="kulzzyNavBtn" data-section="wishes">Wishes</button>
    <button type="button" class="kulzzyNavBtn" data-section="market">Market</button>
    <button type="button" class="kulzzyNavBtn" data-section="more">More</button>
</nav>

<div id="kulzzyContent">

    <section id="kulzzy-home" class="kulzzySection">
        <div id="kulzzyPublished-home" class="kulzzyPublishedContent"></div>
    </section>

    <section id="kulzzy-request" class="kulzzySection">
        <div id="kulzzyPublished-request" class="kulzzyPublishedContent"></div>
    </section>

    <section id="kulzzy-voters" class="kulzzySection">
        <div id="kulzzyVotersHeading"
             style="padding:10px 12px;color:#ffd700;font-weight:bold;font-size:20px">
            VOTERS
        </div>
        <div id="kulzzyVotersGrid" class="kulzzyVotersGrid"></div>
        <div id="kulzzyVotersDetail" class="kulzzyVotersDetail" style="display:none"></div>
    </section>

    <section id="kulzzy-wishes" class="kulzzySection">
        <div id="kulzzyPublished-wishes" class="kulzzyPublishedContent"></div>
    </section>

    <section id="kulzzy-market" class="kulzzySection">
        <div id="kulzzyPublished-market" class="kulzzyPublishedContent"></div>
    </section>

    <section id="kulzzy-more" class="kulzzySection">
        <div id="kulzzyMorePagesMenu"></div>
    </section>

</div>

<div id="kulzzyHomePageContent"></div>
<div id="kulzzyMorePageContent"></div>

<script type="module">
import {initializeApp}
    from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

import {getDatabase,ref,get}
    from "https://www.gstatic.com/firebasejs/12.16.0/firebase-database.js";

const firebaseConfig={
    apiKey:"AIzaSyAgDCVkaem08exFEEL0-gPNKz_6Ziuchmw",
    authDomain:"kulzzy-radio-navigation.firebaseapp.com",
    databaseURL:"https://kulzzy-radio-navigation-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:"kulzzy-radio-navigation",
    storageBucket:"kulzzy-radio-navigation.firebasestorage.app",
    messagingSenderId:"873616483269",
    appId:"1:873616483269:web:38bfd81c9b6eadd8f921ac",
    measurementId:"G-WNGX2S8863"
};

let db=null;

try{
    db=getDatabase(initializeApp(firebaseConfig));
}catch(error){
    console.error("Firebase initialization error:",error);
}

const normalSections=["home","request","wishes","market","voters"];

const sectionCache=Object.create(null);
const sectionLoading=Object.create(null);

let morePagesLoaded=false;
let morePagesLoading=null;
let morePagesData=[];

let homePageLoaded=false;
let homePageLoading=null;
let homePageHTML="";
let homeOverlayBuilt=false;

let kulzzyVotersLoaded=false;
let kulzzyVotersLoading=null;
let kulzzyVoterPages=[];

const $=id=>document.getElementById(id);

/* SHOW ERRORS INSTEAD OF LEAVING PAGES BLANK */
function showPageStatus(container,message,retry){
    if(!container)return;

    container.innerHTML="";

    const box=document.createElement("div");
    box.className="kulzzyPageStatus";

    const messageText=document.createElement("div");
    messageText.textContent=message;
    box.appendChild(messageText);

    if(typeof retry==="function"){
        const button=document.createElement("button");
        button.type="button";
        button.className="kulzzyRetryButton";
        button.textContent="TRY AGAIN";
        button.addEventListener("click",retry);
        box.appendChild(button);
    }

    container.appendChild(box);
}

/* EXTRACT PUBLISHED HTML */
function getPageHTML(page){
    if(!page)return "";

    if(typeof page.html==="string"&&page.html.trim()){
        return page.html;
    }

    for(const field of [
        "content","writeUp","writeup","body","description",
        "pageContent","htmlContent"
    ]){
        if(typeof page[field]==="string"&&page[field].trim()){
            return page[field];
        }
    }

    if(page.blocks&&typeof page.blocks==="object"){
        const blocks=Object.keys(page.blocks).map(id=>{
            const block=page.blocks[id]||{};

            return {
                html:block.html||block.content||block.writeUp||"",
                order:typeof block.order==="number"?block.order:0
            };
        }).filter(block=>
            typeof block.html==="string"&&block.html.trim()
        ).sort((a,b)=>a.order-b.order);

        if(blocks.length){
            return blocks.map(block=>block.html).join("\n\n");
        }
    }

    return "";
}

/* RUN SCRIPTS INCLUDED IN PUBLISHED CONTENT */
function executePublishedScripts(container){
    if(!container)return;

    container.querySelectorAll("script").forEach(oldScript=>{
        const newScript=document.createElement("script");

        Array.from(oldScript.attributes).forEach(attribute=>{
            newScript.setAttribute(attribute.name,attribute.value);
        });

        newScript.textContent=oldScript.textContent;
        oldScript.parentNode?.replaceChild(newScript,oldScript);
    });
}

/* PRESERVE TOUCH AND CLICK INTERACTION */
function enablePublishedTouch(container){
    if(!container)return;

    container.style.pointerEvents="auto";
    container.style.touchAction="auto";
    container.style.overscrollBehavior="auto";

    container.querySelectorAll(
        "button,a,input,textarea,select,label,video,audio,canvas,iframe,[role='button'],[onclick]"
    ).forEach(element=>{
        element.style.pointerEvents="auto";
        element.style.touchAction="auto";
    });
}

/* DISPLAY PUBLISHED SECTION */
function displayNormalContent(section,html){
    const container=$("kulzzyPublished-"+section);
    if(!container)return;

    container.innerHTML="";

    if(!html||!html.trim()){
        sectionCache[section]="";
        return;
    }

    const wrapper=document.createElement("div");
    wrapper.style.width="100%";
    wrapper.style.maxWidth="none";
    wrapper.style.margin="0";
    wrapper.style.padding="0";
    wrapper.innerHTML=html;

    container.appendChild(wrapper);

    executePublishedScripts(wrapper);
    enablePublishedTouch(container);

    sectionCache[section]=container.innerHTML;
}

/* LOAD PUBLISHED SECTIONS WITH VISIBLE ERRORS AND RETRIES */
function loadNormalSection(section){
    if(!normalSections.includes(section)){
        return Promise.resolve();
    }

    const container=$("kulzzyPublished-"+section);
    if(!container)return Promise.resolve();

    if(!db){
        showPageStatus(
            container,
            "The Firebase connection did not start. Check your connection and reload this page.",
            ()=>loadNormalSection(section)
        );
        return Promise.resolve();
    }

    if(Object.prototype.hasOwnProperty.call(sectionCache,section)){
        if(container.innerHTML===""&&sectionCache[section]){
            container.innerHTML=sectionCache[section];
            enablePublishedTouch(container);
        }else if(!sectionCache[section]&&container.innerHTML===""){
            showPageStatus(
                container,
                "No published content was found for this section. Check that the page has been published in the admin panel.",
                ()=>{
                    delete sectionCache[section];
                    loadNormalSection(section);
                }
            );
        }

        return Promise.resolve();
    }

    if(sectionLoading[section]){
        return sectionLoading[section];
    }

    sectionLoading[section]=get(ref(db,"kulzzyContent/"+section))
        .then(snapshot=>{
            const html=snapshot.exists()
                ?getPageHTML(snapshot.val())
                :"";

            displayNormalContent(section,html);

            if(!html.trim()){
                showPageStatus(
                    container,
                    "No published content was found for this section. Check the published page and its Firebase path.",
                    ()=>{
                        delete sectionCache[section];
                        loadNormalSection(section);
                    }
                );
            }
        })
        .catch(error=>{
            console.error("Could not load section:",section,error);

            showPageStatus(
                container,
                "This page could not load from Firebase. Check your internet connection or database permissions, then try again.",
                ()=>{
                    delete sectionCache[section];
                    loadNormalSection(section);
                }
            );
        })
        .finally(()=>{
            delete sectionLoading[section];
        });

    return sectionLoading[section];
}

/* HOME OVERLAY */
function ensureHomeOverlay(){
    const overlay=$("kulzzyHomePageContent");

    if(!overlay||homeOverlayBuilt)return;

    overlay.innerHTML="";

    const box=document.createElement("div");
    box.className="kulzzyHomePageContentBox";
    box.id="kulzzyHomeOverlayBox";

    overlay.appendChild(box);

    homeOverlayBuilt=true;
}

function renderHomeOverlay(){
    ensureHomeOverlay();

    const box=$("kulzzyHomeOverlayBox");
    if(!box)return;

    box.innerHTML="";

    if(homePageHTML){
        box.innerHTML=homePageHTML;
        executePublishedScripts(box);
        enablePublishedTouch(box);
    }else if(homePageLoaded){
        showPageStatus(
            box,
            "No published Home content was found. Check that the Home page is published in the admin panel.",
            ()=>{
                homePageLoaded=false;
                homePageHTML="";
                openHomePage();
            }
        );
    }
}

function openHomePage(){
    const overlay=$("kulzzyHomePageContent");
    if(!overlay)return;

    ensureHomeOverlay();

    overlay.classList.add("open");
    renderHomeOverlay();

    if(homePageLoaded||homePageLoading)return;

    if(!db){
        showPageStatus(
            $("kulzzyHomeOverlayBox"),
            "The Firebase connection did not start. Check your connection and reload this page.",
            ()=>openHomePage()
        );
        return;
    }

    homePageLoading=get(ref(db,"kulzzyContent/home"))
        .then(snapshot=>{
            homePageHTML=snapshot.exists()
                ?getPageHTML(snapshot.val())
                :"";

            homePageLoaded=true;

            displayNormalContent("home",homePageHTML);

            if(overlay.classList.contains("open")){
                renderHomeOverlay();
            }
        })
        .catch(error=>{
            console.error("Home loading error:",error);

            showPageStatus(
                $("kulzzyHomeOverlayBox"),
                "Home could not load from Firebase. Check your internet connection or database permissions, then try again.",
                ()=>{
                    homePageLoaded=false;
                    homePageHTML="";
                    openHomePage();
                }
            );
        })
        .finally(()=>{
            homePageLoading=null;
        });
}

function closeHomePage(){
    $("kulzzyHomePageContent")?.classList.remove("open");
}

/* MORE PAGE ICONS */
function getMorePageIcon(title){
    const text=String(title||"").toLowerCase();

    if(text.includes("about"))return "ℹ️";
    if(text.includes("contact"))return "📞";
    if(text.includes("chat"))return "💬";
    if(text.includes("radio"))return "📻";
    if(text.includes("program"))return "🎙️";

    if(text.includes("business")||
       text.includes("market")||
       text.includes("service"))return "💼";

    if(text.includes("birthday")||
       text.includes("celebration")||
       text.includes("birth"))return "🎂";

    if(text.includes("music")||text.includes("song"))return "🎵";
    if(text.includes("news"))return "📰";
    if(text.includes("event"))return "🎉";

    if(text.includes("photo")||
       text.includes("picture")||
       text.includes("gallery"))return "🖼️";

    if(text.includes("video"))return "🎬";
    if(text.includes("live"))return "🔴";
    if(text.includes("request"))return "📝";
    if(text.includes("wish"))return "💝";

    if(text.includes("install")||text.includes("app"))return "📱";

    return "📄";
}

/* LOAD MORE PAGES WITH ERROR HANDLING */
function loadMorePages(){
    const menu=$("kulzzyMorePagesMenu");

    if(!menu)return Promise.resolve();

    if(!db){
        showPageStatus(
            menu,
            "The Firebase connection did not start, so More pages cannot load. Check your connection and reload.",
            ()=>loadMorePages()
        );
        return Promise.resolve();
    }

    if(morePagesLoaded)return Promise.resolve();
    if(morePagesLoading)return morePagesLoading;

    morePagesLoading=get(ref(db,"kulzzyMorePages"))
        .then(snapshot=>{
            const raw=snapshot.exists()?snapshot.val():{};

            morePagesData=Object.keys(raw).map(id=>{
                const page=raw[id]||{};

                return {
                    id,
                    title:page.title||page.name||"Untitled Page",
                    html:getPageHTML(page),
                    order:typeof page.order==="number"?page.order:0
                };
            }).sort((a,b)=>a.order-b.order);

            const fragment=document.createDocumentFragment();

            morePagesData.forEach(page=>{
                const button=document.createElement("button");

                button.type="button";
                button.className="kulzzyMorePageButton";

                const icon=document.createElement("span");
                icon.className="kulzzyMorePageIcon";
                icon.textContent=getMorePageIcon(page.title);

                const title=document.createElement("span");
                title.className="kulzzyMorePageTitle";
                title.textContent=page.title;

                button.append(icon,title);

                button.addEventListener("click",()=>{
                    showMorePage(page,button);
                });

                fragment.appendChild(button);
            });

            menu.replaceChildren(fragment);

            if(!morePagesData.length){
                menu.innerHTML=
                    '<div style="padding:15px;color:white">No additional pages available.</div>';
            }

            morePagesLoaded=true;
        })
        .catch(error=>{
            console.error("More pages loading error:",error);

            showPageStatus(
                menu,
                "More pages could not load from Firebase. Check your internet connection or database permissions, then try again.",
                ()=>{
                    morePagesLoaded=false;
                    loadMorePages();
                }
            );
        })
        .finally(()=>{
            morePagesLoading=null;
        });

    return morePagesLoading;
}

/* OPEN A MORE PAGE */
function showMorePage(page,button){
    const menu=$("kulzzyMorePagesMenu");
    const content=$("kulzzyMorePageContent");

    if(!content||!menu)return;

    document.querySelectorAll(".kulzzyMorePageButton")
        .forEach(item=>item.classList.remove("active"));

    if(button)button.classList.add("active");

    content.innerHTML="";

    const close=document.createElement("button");

    close.type="button";
    close.className="kulzzyMorePageClose";
    close.textContent="✕";
    close.setAttribute("aria-label","Close page");

    close.addEventListener("click",closeMorePage);

    const box=document.createElement("div");
    box.className="kulzzyMorePageContentBox";

    box.innerHTML=page.html||
        '<div style="padding:15px;color:white">This page has no content yet.</div>';

    content.append(close,box);

    content.classList.add("open");
    content.scrollTop=0;

    menu.style.display="none";

    executePublishedScripts(box);
    enablePublishedTouch(box);
}

function closeMorePage(){
    const content=$("kulzzyMorePageContent");
    const menu=$("kulzzyMorePagesMenu");

    if(content){
        content.classList.remove("open");
        content.innerHTML="";
        content.scrollTop=0;
    }

    if(menu)menu.style.display="flex";

    document.querySelectorAll(".kulzzyMorePageButton")
        .forEach(item=>item.classList.remove("active"));
}

/* VOTERS */
function kulzzyVoterHtml(page){
    if(typeof page.html==="string"&&page.html.trim()){
        return page.html;
    }

    for(const key of ["content","writeUp","description","body"]){
        if(typeof page[key]==="string"&&page[key].trim()){
            return page[key];
        }
    }

    return "";
}

/* LOAD VOTING COMPETITIONS */
function loadKulzzyVoters(){
    const grid=$("kulzzyVotersGrid");
    const detail=$("kulzzyVotersDetail");

    if(!grid)return Promise.resolve();

    if(!db){
        showPageStatus(
            grid,
            "The Firebase connection did not start, so voting competitions cannot load. Check your connection and reload.",
            ()=>loadKulzzyVoters()
        );
        return Promise.resolve();
    }

    if(kulzzyVotersLoaded)return Promise.resolve();
    if(kulzzyVotersLoading)return kulzzyVotersLoading;

    grid.innerHTML="";

    kulzzyVotersLoading=get(ref(db,"kulzzyVotersPages"))
        .then(snapshot=>{
            const raw=snapshot.exists()?snapshot.val():{};

            kulzzyVoterPages=Object.keys(raw)
                .map(id=>({id,...(raw[id]||{})}))
                .filter(page=>page.published!==false)
                .sort((a,b)=>
                    (Number(a.order)||0)-(Number(b.order)||0)
                );

            grid.innerHTML="";

            if(detail){
                detail.style.display="none";
                detail.innerHTML="";
            }

            if(!kulzzyVoterPages.length){
                grid.innerHTML=
                    '<div class="kulzzyVotersEmpty">No voting competitions are available right now.</div>';

                kulzzyVotersLoaded=true;
                return;
            }

            const fragment=document.createDocumentFragment();

            kulzzyVoterPages.forEach(page=>{
                const card=document.createElement("button");

                card.type="button";
                card.className="kulzzyVoterCard";

                const image=document.createElement("img");

                image.loading="lazy";
                image.alt=page.title||"Voting competition";

                image.src=page.image||page.imageUrl||
                    "data:image/svg+xml;charset=UTF-8,"+
                    encodeURIComponent(
                        '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">'+
                        '<rect width="100%" height="100%" fill="#10274c"/>'+
                        '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#ffd700" font-size="24">KULZZY VOTERS</text>'+
                        '</svg>'
                    );

                image.onerror=()=>{
                    image.style.display="none";
                };

                const title=document.createElement("span");

                title.className="kulzzyVoterCardTitle";
                title.textContent=page.title||"Voting Competition";

                card.append(image,title);

                card.addEventListener("click",()=>{
                    openKulzzyVoterPage(page);
                });

                fragment.appendChild(card);
            });

            grid.appendChild(fragment);

            kulzzyVotersLoaded=true;
        })
        .catch(error=>{
            console.error("Could not load Voters pages:",error);

            showPageStatus(
                grid,
                "Voting competitions could not be retrieved from Firebase. Check your internet connection or database permissions, then try again.",
                ()=>{
                    kulzzyVotersLoaded=false;
                    loadKulzzyVoters();
                }
            );
        })
        .finally(()=>{
            kulzzyVotersLoading=null;
        });

    return kulzzyVotersLoading;
}

/* OPEN A VOTING COMPETITION */
function openKulzzyVoterPage(page){
    const grid=$("kulzzyVotersGrid");
    const detail=$("kulzzyVotersDetail");

    if(!grid||!detail)return;

    grid.style.display="none";
    detail.style.display="block";
    detail.innerHTML="";

    const back=document.createElement("button");

    back.type="button";
    back.className="kulzzyVoterBack";
    back.textContent="← BACK TO VOTING COMPETITIONS";

    back.addEventListener("click",()=>{
        detail.style.display="none";
        detail.innerHTML="";
        grid.style.display="grid";
        $("kulzzyContent").scrollTop=0;
    });

    const title=document.createElement("div");

    title.className="kulzzyVoterDetailTitle";
    title.textContent=page.title||"Voting Competition";

    const body=document.createElement("div");
    body.className="kulzzyVoterDetailBody";

    detail.append(back,title,body);

    const target=page.url||page.pageUrl||page.link||"";

    if(target.trim()){
        const frame=document.createElement("iframe");

        frame.src=target.trim();
        frame.title=page.title||"Voting Competition";
        frame.loading="eager";

        frame.setAttribute(
            "allow",
            "autoplay; clipboard-write; encrypted-media; fullscreen"
        );

        body.appendChild(frame);
    }else{
        const html=kulzzyVoterHtml(page);

        if(html){
            body.innerHTML=html;

            executePublishedScripts(body);
            enablePublishedTouch(body);
        }else{
            body.innerHTML=
                '<div class="kulzzyVotersEmpty">This competition has no page content or voting link yet.</div>';
        }
    }

    $("kulzzyContent").scrollTop=0;
}

/* NAVIGATION */
function openSection(section,button){
    if(!normalSections.includes(section)&&section!=="more"){
        return;
    }

    const homeOverlay=$("kulzzyHomePageContent");
    const moreContent=$("kulzzyMorePageContent");
    const moreMenu=$("kulzzyMorePagesMenu");

    document.querySelectorAll(".kulzzyNavBtn").forEach(item=>{
        item.classList.toggle("active",item===button);
    });

    if(section!=="home"&&homeOverlay){
        homeOverlay.classList.remove("open");
    }

    if(section!=="more"&&moreContent){
        moreContent.classList.remove("open");
        moreContent.innerHTML="";

        if(moreMenu){
            moreMenu.style.display="flex";
        }
    }

    try{
        localStorage.setItem("kulzzyLastSection",section);
    }catch(error){}

    if(section==="home"){
        document.querySelectorAll(".kulzzySection")
            .forEach(item=>item.classList.remove("active"));

        openHomePage();
        return;
    }

    document.querySelectorAll(".kulzzySection").forEach(item=>{
        item.classList.toggle(
            "active",
            item.id==="kulzzy-"+section
        );
    });

    if(section==="more"){
        loadMorePages();
        return;
    }

    if(section==="voters"){
        const grid=$("kulzzyVotersGrid");
        const detail=$("kulzzyVotersDetail");

        if(grid){
            grid.style.display="grid";
        }

        if(detail){
            detail.style.display="none";
            detail.innerHTML="";
        }

        loadKulzzyVoters();
        return;
    }

    loadNormalSection(section);
}

/* SUPPORT EXISTING PUBLISHED BUTTONS */
window.kulzzyOpen=function(section,button){
    const actualButton=button||
        document.querySelector(
            '.kulzzyNavBtn[data-section="'+section+'"]'
        );

    openSection(section,actualButton);
};

/* REGISTER NAVIGATION CLICKS */
document.querySelectorAll(".kulzzyNavBtn").forEach(button=>{
    button.addEventListener("click",event=>{
        event.preventDefault();
        openSection(button.dataset.section,button);
    });
});

/* STARTUP */
let savedSection=null;

try{
    savedSection=localStorage.getItem("kulzzyLastSection");
}catch(error){}

if(
    !savedSection||
    (!normalSections.includes(savedSection)&&savedSection!=="more")
){
    savedSection="home";
}

const initialButton=
    document.querySelector(
        '.kulzzyNavBtn[data-section="'+savedSection+'"]'
    )||
    document.querySelector(
        '.kulzzyNavBtn[data-section="home"]'
    );

openSection(savedSection,initialButton);

/* PRELOAD PUBLISHED CONTENT */
window.setTimeout(()=>{
    if(!db)return;

    Promise.allSettled([
        loadNormalSection("request"),
        loadNormalSection("wishes"),
        loadNormalSection("market")
    ]);
},100);

</script>
