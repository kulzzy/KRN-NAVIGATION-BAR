<script type="module">

import {

from

import {

from

/* =====================================================
   FIREBASE CONFIGURATION
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyBH85NGWsSA5cubbPdnmunwYZFZpj_CB0",

    authDomain:
        "kulzzy-radio-chat.firebaseapp.com",

    databaseURL:
        "https://kulzzy-radio-chat-default-rtdb.europe-west1.firebasedatabase.app",

    projectId:
        "kulzzy-radio-chat",

    storageBucket:
        "kulzzy-radio-chat.firebasestorage.app",

    messagingSenderId:
        "510100635134",

    appId:
        "1:510100635134:web:9d3b2e983eb6e9a385d4af"

};


let app = null;
let db = null;


try{

    app = initializeApp(firebaseConfig);

    db = getDatabase(app);

}
catch(error){

    console.error(
        "Firebase initialization error:",

    );

/* =====================================================
   DYNAMIC EVENT BUTTON NAME
===================================================== */

const DEFAULT_EVENT_BUTTON_NAME =
    "👑 FACE OF KULZZY RADIO";

const eventButtonNameRef =
    db
    ? ref(
        db,
        "kulzzyNavigation/eventName"
      )
    : null;

const eventButton =
    document.getElementById(
        "kulzzyRequestButtonName"
    );


function updateEventButtonName(name){

    if(!eventButton){
        return;
    }

    if(
        typeof name !== "string" ||
        !name.trim()
    ){

        eventButton.textContent =
            DEFAULT_EVENT_BUTTON_NAME;

        return;

    }

    eventButton.textContent =
        name.trim();

}


if(
    db &&
    eventButtonNameRef
){

    onValue(

        eventButtonNameRef,

        function(snapshot){

            updateEventButtonName(
                snapshot.val()
            );

        },

        function(error){

            console.error(
                "Event button Firebase error:",
                error
            );

            updateEventButtonName(
                DEFAULT_EVENT_BUTTON_NAME
            );

        }

    );

}


/* =====================================================
   NORMAL SECTIONS
===================================================== */

const normalSections = [
    "home",
    "request",
    "wishes",
    "market"
];


/* =====================================================
   MEMORY CACHE
===================================================== */

const sectionCache =
    Object.create(null);

const sectionLoading =
    Object.create(null);


/* =====================================================
   MORE CACHE
===================================================== */

let morePagesLoaded = false;
let morePagesLoading = null;
let morePagesData = [];


/* =====================================================
   HOME CACHE
===================================================== */

let homePageLoaded = false;
let homePageLoading = null;


/* =====================================================
   GET PAGE HTML
===================================================== */

function getPageHTML(page){

    if(!page){
        return "";
    }

    if(
        typeof page.html === "string" &&
        page.html.trim()
    ){

        return page.html;

    }

    const possibleFields = [
        "content",
        "writeUp",
        "writeup",
        "body",
        "description",
        "pageContent",
        "htmlContent"
    ];

    for(
        const field of possibleFields
    ){

        if(
            typeof page[field] === "string" &&
            page[field].trim()
        ){

            return page[field];

        }

    }

    if(
        page.blocks &&
        typeof page.blocks === "object"
    ){

        const blocks =

            Object.keys(
                page.blocks
            )

            .map(function(id){

                const block =
                    page.blocks[id] || {};

                return {

                    id:id,

                    html:
                        block.html ||
                        block.content ||
                        block.writeUp ||
                        "",

                    order:
                        typeof block.order === "number"
                        ? block.order
                        : 0

                };

            })

            .filter(function(block){

                return (
                    typeof block.html === "string" &&
                    block.html.trim()
                );

            })

            .sort(function(a,b){

                return a.order - b.order;

            });

        if(blocks.length){

            return blocks
                .map(function(block){
                    return block.html;
                })
                .join("\n\n");

        }

    }

    return "";
}


/* =====================================================
   EXECUTE PUBLISHED SCRIPTS
===================================================== */

function executePublishedScripts(container){

    if(!container){
        return;
    }

    const scripts =
        container.querySelectorAll("script");

    scripts.forEach(function(oldScript){

        const newScript =
            document.createElement("script");

        Array.from(
            oldScript.attributes
        )
        .forEach(function(attribute){

            newScript.setAttribute(
                attribute.name,
                attribute.value
            );

        });

        newScript.textContent =
            oldScript.textContent;

        if(oldScript.parentNode){

            oldScript.parentNode.replaceChild(
                newScript,
                oldScript
            );

        }

    });

}


/* =====================================================
   NATIVE TOUCH ACCESS
===================================================== */

function enablePublishedTouch(container){

    if(!container){
        return;
    }

    container.style.pointerEvents =
        "auto";

    container.style.touchAction =
        "auto";

    container.style.overscrollBehavior =
        "auto";


    const all =
        container.querySelectorAll("*");

    all.forEach(function(element){

        element.style.pointerEvents =
            "auto";

    });


    const normalInteractive =
        container.querySelectorAll(
            "button, a, input, textarea, select, label, video, audio, canvas, [role='button'], [onclick]"
        );

    normalInteractive.forEach(function(element){

        element.style.pointerEvents =
            "auto";

    });


    container
        .querySelectorAll("iframe")
        .forEach(function(frame){

            frame.style.pointerEvents =
                "auto";

        });

}


/* =====================================================
   DISPLAY NORMAL CONTENT
===================================================== */

function displayNormalContent(
    section,
    html
){

    const container =
        document.getElementById(
            "kulzzyPublished-" + section
        );

    if(!container){
        return;
    }

    if(!html || !html.trim()){

        container.innerHTML = "";

        sectionCache[section] = "";

        return;

    }


    const wrapper =
        document.createElement("div");


    wrapper.style.width =
        "100%";

    wrapper.style.maxWidth =
        "none";

    wrapper.style.margin =
        "0";

    wrapper.style.padding =
        "0";

    wrapper.style.pointerEvents =
        "auto";

    wrapper.style.touchAction =
        "auto";

    wrapper.style.overscrollBehavior =
        "auto";


    wrapper.innerHTML =
        html;


    container.innerHTML =
        "";


    container.appendChild(
        wrapper
    );


    executePublishedScripts(
        wrapper
    );


    enablePublishedTouch(
        container
    );


    sectionCache[section] =
        container.innerHTML;

}


/* =====================================================
   LOAD NORMAL SECTION
===================================================== */

async function loadNormalSection(section){

    if(
        !normalSections.includes(section)
    ){
        return;
    }


    const container =
        document.getElementById(
            "kulzzyPublished-" + section
        );


    if(!container){
        return;
    }


    if(
        Object.prototype.hasOwnProperty.call(
            sectionCache,
            section
        )
    ){

        if(
            container.innerHTML === "" &&
            sectionCache[section]
        ){

            container.innerHTML =
                sectionCache[section];

            enablePublishedTouch(
                container
            );

        }

        return;

    }


    if(sectionLoading[section]){
        return sectionLoading[section];
    }


    if(!db){
        return;
    }


    sectionLoading[section] =

        get(
            ref(
                db,
                "kulzzyContent/" + section
            )
        )

        .then(function(snapshot){

            if(!snapshot.exists()){

                container.innerHTML = "";

                sectionCache[section] = "";

                return;

            }


            const data =
                snapshot.val();


            const html =
                getPageHTML(data);


            displayNormalContent(
                section,
                html
            );

        })

        .catch(function(error){

            console.error(
                "Firebase section error:",
                section,
                error
            );

        })

        .finally(function(){

            delete sectionLoading[section];

        });


    return sectionLoading[section];

}


/* =====================================================
   OPEN HOME LIKE MORE
===================================================== */

async function openHomePage(){

    const homeOverlay =
        document.getElementById(
            "kulzzyHomePageContent"
        );

    if(!homeOverlay){
        return;
    }


    homeOverlay.innerHTML =
        "";


    const closeButton =
        document.createElement(
            "button"
        );


    closeButton.type =
        "button";


    closeButton.className =
        "kulzzyHomePageClose";


    closeButton.innerHTML =
        "✕";


    closeButton.setAttribute(
        "aria-label",
        "Close Home"
    );


    closeButton.addEventListener(
        "click",
        function(){

            closeHomePage();

        }
    );


    homeOverlay.appendChild(
        closeButton
    );


    const pageBox =
        document.createElement(
            "div"
        );


    pageBox.className =
        "kulzzyHomePageContentBox";


    homeOverlay.appendChild(
        pageBox
    );


    homeOverlay.classList.add(
        "open"
    );


    if(homePageLoaded){

        const homeContainer =
            document.getElementById(
                "kulzzyPublished-home"
            );

        if(
            homeContainer &&
            homeContainer.innerHTML
        ){

            pageBox.innerHTML =
                homeContainer.innerHTML;

            executePublishedScripts(
                pageBox
            );

            enablePublishedTouch(
                pageBox
            );

        }

        homeOverlay.scrollTop =
            0;

        return;

    }


    if(homePageLoading){

        await homePageLoading;

    }
    else{

        if(!db){

            homeOverlay.classList.remove(
                "open"
            );

            return;

        }


        homePageLoading =

            get(
                ref(
                    db,
                    "kulzzyContent/home"
                )
            )

            .then(function(snapshot){

                if(!snapshot.exists()){

                    return;

                }


                const data =
                    snapshot.val();


                const html =
                    getPageHTML(data);


                if(
                    html &&
                    html.trim()
                ){

                    pageBox.innerHTML =
                        html;

                    executePublishedScripts(
                        pageBox
                    );

                    enablePublishedTouch(
                        pageBox
                    );


                    /*
                       Keep the original Home
                       Firebase content cached.
                    */

                    displayNormalContent(
                        "home",
                        html
                    );

                }


                homePageLoaded =
                    true;

            })

            .catch(function(error){

                console.error(
                    "Firebase Home page error:",
                    error
                );

            })

            .finally(function(){

                homePageLoading =
                    null;

            });


        await homePageLoading;

    }


    homeOverlay.scrollTop =
        0;

}


/* =====================================================
   CLOSE HOME
===================================================== */

function closeHomePage(){

    const homeOverlay =
        document.getElementById(
            "kulzzyHomePageContent"
        );


    if(!homeOverlay){
        return;
    }


    homeOverlay.classList.remove(
        "open"
    );


    homeOverlay.innerHTML =
        "";


    try{

        localStorage.setItem(
            "kulzzyLastSection",
            "home"
        );

    }
    catch(error){

        console.log(
            "Local storage unavailable"
        );

    }

}


/* =====================================================
   OPEN SECTION
===================================================== */

function openSection(
    section,
    button
){

    const morePageContent =
        document.getElementById(
            "kulzzyMorePageContent"
        );

    const moreMenu =
        document.getElementById(
            "kulzzyMorePagesMenu"
        );

    const homeOverlay =
        document.getElementById(
            "kulzzyHomePageContent"
        );


    /* =================================================
       CLOSE HOME WHEN ANOTHER SECTION OPENS
    ================================================= */

    if(homeOverlay){

        homeOverlay.classList.remove(
            "open"
        );

        homeOverlay.innerHTML =
            "";

    }


    /* =================================================
       CLOSE MORE PAGE WHEN ANOTHER SECTION OPENS
    ================================================= */

    if(morePageContent){

        morePageContent.classList.remove(
            "open"
        );

        morePageContent.innerHTML =
            "";

    }


    if(moreMenu){

        moreMenu.style.display =
            "flex";

    }


    try{

        localStorage.setItem(
            "kulzzyLastSection",
            section
        );

    }
    catch(error){

        console.log(
            "Local storage unavailable"
        );

    }


    /* =================================================
       HOME IS NOW LIKE MORE
    ================================================= */

    if(section === "home"){

        document
            .querySelectorAll(
                ".kulzzySection"
            )
            .forEach(function(item){

                item.classList.remove(
                    "active"
                );

            });


        document
            .querySelectorAll(
                ".kulzzyNavBtn"
            )
            .forEach(function(item){

                item.classList.remove(
                    "active"
                );

            });


        if(button){

            button.classList.add(
                "active"
            );

        }


        openHomePage();

        return;

    }


    /* =================================================
       NORMAL SECTIONS
    ================================================= */

    document
        .querySelectorAll(
            ".kulzzySection"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    const target =
        document.getElementById(
            "kulzzy-" + section
        );


    if(target){

        target.classList.add(
            "active"
        );

    }


    document
        .querySelectorAll(
            ".kulzzyNavBtn"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    if(
        normalSections.includes(section)
    ){

        loadNormalSection(
            section
        );

    }


    if(section === "more"){

        loadMorePages();

    }

}


/* =====================================================
   PUBLIC NAVIGATION
===================================================== */

window.kulzzyOpen =
    function(section,button){

        openSection(
            section,
            button
        );

    };


/* =====================================================
   NAVIGATION EVENTS
===================================================== */

document
    .querySelectorAll(
        ".kulzzyNavBtn"
    )
    .forEach(function(button){

        button.addEventListener(
            "click",
            function(){

                openSection(
                    button.dataset.section,
                    button
                );

            }
        );

    });


/* =====================================================
   RESTORE LAST OPENED SECTION
===================================================== */

let savedSection = null;


try{

    savedSection =
        localStorage.getItem(
            "kulzzyLastSection"
        );

}
catch(error){

    savedSection =
        null;

}


if(
    savedSection &&
    (
        normalSections.includes(
            savedSection
        ) ||
        savedSection === "more"
    )
){

    const savedButton =
        document.querySelector(
            '.kulzzyNavBtn[data-section="' +
            savedSection +
            '"]'
        );


    if(savedButton){

        openSection(
            savedSection,
            savedButton
        );

    }

}


/* =====================================================
   LOAD MORE PAGES
===================================================== */

async function loadMorePages(){

    const menu =
        document.getElementById(
            "kulzzyMorePagesMenu"
        );

    const content =
        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(!menu || !content){
        return;
    }


    if(morePagesLoaded){
        return;
    }


    if(morePagesLoading){
        return morePagesLoading;
    }


    if(!db){
        return;
    }


    morePagesLoading =

        get(
            ref(
                db,
                "kulzzyMorePages"
            )
        )

        .then(function(snapshot){

            menu.innerHTML =
                "";

            content.innerHTML =
                "";


            if(!snapshot.exists()){

                morePagesLoaded =
                    true;

                return;

            }


            const data =
                snapshot.val();


            morePagesData =

                Object.keys(data)

                .map(function(id){

                    const page =
                        data[id] || {};

                    return {

                        id:id,

                        title:
                            page.title ||
                            page.name ||
                            "Untitled Page",

                        html:
                            getPageHTML(page),

                        order:
                            typeof page.order === "number"
                            ? page.order
                            : 0

                    };

                })

                .sort(function(a,b){

                    return a.order - b.order;

                });


            const fragment =
                document.createDocumentFragment();


            morePagesData.forEach(
                function(page){

                    const button =
                        document.createElement(
                            "button"
                        );


                    button.type =
                        "button";

                    button.className =
                        "kulzzyMorePageButton";


                    const icon =
                        document.createElement(
                            "span"
                        );


                    icon.className =
                        "kulzzyMorePageIcon";


                    icon.textContent =
                        getMorePageIcon(
                            page.title
                        );


                    const title =
                        document.createElement(
                            "span"
                        );


                    title.className =
                        "kulzzyMorePageTitle";


                    title.textContent =
                        page.title;


                    button.appendChild(
                        icon
                    );

                    button.appendChild(
                        title
                    );


                    button.addEventListener(
                        "click",
                        function(){

                            showMorePage(
                                page,
                                button
                            );

                        }
                    );


                    fragment.appendChild(
                        button
                    );

                }
            );


            menu.appendChild(
                fragment
            );


            morePagesLoaded =
                true;

        })

        .catch(function(error){

            console.error(
                "Firebase More pages error:",
                error
            );

        })

        .finally(function(){

            morePagesLoading =
                null;

        });


    return morePagesLoading;

}


/* =====================================================
   MORE PAGE TITLE ICON
===================================================== */

function getMorePageIcon(title){

    const text =
        String(
            title || ""
        ).toLowerCase();


    if(text.includes("about"))
        return "ℹ️";

    if(text.includes("contact"))
        return "📞";

    if(text.includes("chat"))
        return "💬";

    if(text.includes("radio"))
        return "📻";

    if(text.includes("program"))
        return "🎙️";


    if(
        text.includes("business") ||
        text.includes("market") ||
        text.includes("service")
    )
        return "💼";


    if(
        text.includes("birthday") ||
        text.includes("celebration") ||
        text.includes("birth")
    )
        return "🎂";


    if(
        text.includes("music") ||
        text.includes("song")
    )
        return "🎵";


    if(text.includes("news"))
        return "📰";

    if(text.includes("event"))
        return "🎉";


    if(
        text.includes("photo") ||
        text.includes("picture") ||
        text.includes("gallery")
    )
        return "🖼️";


    if(text.includes("video"))
        return "🎬";

    if(text.includes("live"))
        return "🔴";

    if(text.includes("request"))
        return "📝";

    if(text.includes("wish"))
        return "💝";


    if(
        text.includes("install") ||
        text.includes("app")
    )
        return "📱";


    return "📄";

}


/* =====================================================
   SHOW MORE PAGE
===================================================== */

function showMorePage(
    page,
    button
){

    const menu =
        document.getElementById(
            "kulzzyMorePagesMenu"
        );

    const content =
        document.getElementById(
            "kulzzyMorePageContent"
        );


    if(!content || !menu){
        return;
    }


    document
        .querySelectorAll(
            ".kulzzyMorePageButton"
        )
        .forEach(function(item){

            item.classList.remove(
                "active"
            );

        });


    if(button){

        button.classList.add(
            "active"
        );

    }


    content.innerHTML =
        "";


    const closeButton =
        document.createElement(
            "button"
        );


    closeButton.type =
        "button";


    closeButton.className =
        "kulzzyMorePageClose";


    closeButton.innerHTML =
        "✕";


    closeButton.setAttribute(
        "aria-label",
        "Close page"
    );


    closeButton.addEventListener(
        "click",
        function(){

            content.classList.remove(
                "open"
            );

            content.innerHTML =
                "";

            menu.style.display =
                "flex";


            const mainScroll =
                document.getElementById(
                    "kulzzyContent"
                );


            if(mainScroll){

                mainScroll.scrollTop =
                    0;

            }


            document
                .querySelectorAll(
                    ".kulzzyMorePageButton"
                )
                .forEach(function(item){

                    item.classList.remove(
                        "active"
                    );

                });

        }
    );


    content.appendChild(
        closeButton
    );


    const html =
        getPageHTML(page);


    if(
        html &&
        html.trim()
    ){

        const pageBox =
            document.createElement(
                "div"
            );


        pageBox.className =
            "kulzzyMorePageContentBox";


        pageBox.innerHTML =
            html;


        content.appendChild(
            pageBox
        );


        executePublishedScripts(
            pageBox
        );


        enablePublishedTouch(
            pageBox
        );

    }


    menu.style.display =
        "none";


    content.classList.add(
        "open"
    );


    const mainScroll =
        document.getElementById(
            "kulzzyContent"
        );


    if(mainScroll){

        mainScroll.scrollTop =
            0;

    }

}


/* =====================================================
   START HOME
===================================================== */

if(db){

    if(
        !savedSection ||
        !(
            normalSections.includes(
                savedSection
            ) ||
            savedSection === "more"
        )
    ){

        const homeButton =
            document.querySelector(
                '.kulzzyNavBtn[data-section="home"]'
            );

        openSection(

        );

}


/* =====================================================
   QUIET BACKGROUND PRELOAD
===================================================== */

setTimeout(function(){

    if(!db){
        return;
    }


    [
        "request",
        "wishes",
        "market"
    ]
    .forEach(function(section){

        if(

===================================================== */

    const content =
        document.getElementById(
            "kulzzyContent"
        );


    if(content){

        content.style.pointerEvents =
            "auto";

        content.style.touchAction =

    }


    document
        .querySelectorAll(
            ".kulzzyPublishedContent"
        )

            enablePublishedTouch(

            );

        );

            "auto";

        more.style.overscrollBehavior =

    }

        );


    if(home){

            "auto";

        home.style.touchAction =
            "auto";

        home.style.overscrollBehavior =
            "auto";

    }

}


setTimeout(

);

setTimeout(
